function interpretDream() {
    const input = document.getElementById('dreamInput');
    const text = input.value.trim();

        alert('الرجاء إدخال وصف أوضح للحلم.');
        return;
    }

    // البحث في قاعدة البيانات
    let found = null;
    let keyword = null;

    for (const [key, value] of Object.entries(dreamDatabase)) {
        if (text.includes(key)) {
            found = value;
            keyword = key;
            break;
        }
    }

    // تجهيز النتيجة
    let result;
    if (found) {
        result = {
            تفسير: found.تفسير,
            نفسي: found.نفسي,
            روحي: found.روحي,
            نصيحة: found.نصيحة,
            مفتاح: keyword,
            موجود: true
        };
    } else {
        const msg = kindMessages[Math.floor(Math.random() * kindMessages.length)];

            نفسي: "لا يمكن تحديده بدقة، لكنه يعكس مشاعرك الحالية.",
