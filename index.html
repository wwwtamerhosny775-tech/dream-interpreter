<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تفسير الأحلام - عبدالقادر</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0b0e1a; color: #eee; padding:20px; }
        header { text-align:center; padding:20px; border-bottom:2px solid #f0c27f; }
        header h1 { color:#f0c27f; }
        .input-section { max-width:800px; margin:30px auto; }
        textarea { width:100%; height:120px; padding:15px; border-radius:12px; background:#2a2f45; color:#eee; font-size:1.1rem; border:none; }
        button { padding:14px 28px; border:none; border-radius:30px; background:#f0c27f; color:#1a1f2f; font-weight:bold; cursor:pointer; margin:10px; }
        .result-section { max-width:800px; margin:20px auto; background:#1e2337; padding:25px; border-radius:16px; border:1px solid #f0c27f55; }
        .hidden { display:none; }
        .result-item { padding:10px 0; border-bottom:1px solid #2a2f45; }
        .label { color:#f0c27f; font-weight:bold; }
        .value { color:#ddd; margin-top:4px; }
        footer { text-align:center; color:#888; margin-top:40px; padding-top:20px; border-top:1px solid #2a2f45; }
        #reason { color:#aaa; font-style:italic; }
    </style>
</head>
<body>

    <header>
        <h1>🌙 برنامج تفسير الأحلام الذكي</h1>
        <p>المبرمج: <strong>عبدالقادر عصام حسن محمد</strong> - 775800699</p>
        <p>قاعدة البيانات: <span id="dreamCount">5000</span> حلم</p>
    </header>

    <section class="input-section">
        <textarea id="dreamInput" placeholder="اكتب وصف حلمك هنا..."></textarea>
        <button onclick="interpretDream()">🔮 فسّر حلمي</button>
        <button onclick="clearAll()">🗑️ مسح</button>
    </section>

    <section id="resultSection" class="result-section hidden">
        <div id="resultContent"></div>
    </section>

    <footer>
        <p>تم التطوير بواسطة: عبدالقادر عصام حسن محمد - 775800699</p>
        <p>جميع الحقوق محفوظة © 2026</p>
        <p id="reason">🌱 صُنع هذا الموقع لأكون عوناً للناس في فهم رؤاهم، وأسأل الله النفع.</p>
    </footer>

    <script>
        const dreamDatabase = {
            "الماء": { تفسير: "حياة ورزق وبركة", نفسي: "رغبة في النقاء", روحي: "فيض إلهي", نصيحة: "اشكر الله" },
            "النار": { تفسير: "قوة وغضب", نفسي: "انفعال مكبوت", روحي: "تطهير", نصيحة: "تحكم بغضبك" },
            "الطيران": { تفسير: "طموح وحرية", نفسي: "رغبة في التحرر", روحي: "ارتقاء", نصيحة: "تواضع" },
            "الثعبان": { تفسير: "عدو خفي", نفسي: "خوف", روحي: "فتنة", نصيحة: "توكل على الله" },
            "الذهب": { تفسير: "مال وهم", نفسي: "طمع", روحي: "زينة الدنيا", نصيحة: "أذكر الآخرة" },
            "الموت": { تفسير: "تحول وبعث", نفسي: "خوف من المجهول", روحي: "لقاء الله", نصيحة: "استعد" },
            "الزواج": { تفسير: "فرح وارتباط", نفسي: "رغبة في الاستقرار", روحي: "نصف الدين", نصيحة: "أحسن الاختيار" },
            "السفر": { تفسير: "تغيير", نفسي: "هروب", روحي: "رحلة روح", نصيحة: "تزود بالتقوى" },
            "الأسد": { تفسير: "سلطان", نفسي: "قوة", روحي: "عزة", نصيحة: "لا تغتر" },
            "الورد": { تفسير: "جمال", نفسي: "حب", روحي: "راحة", نصيحة: "أشكر الله" },
            "البحر": { تفسير: "دنيا واسعة", نفسي: "رغبة في المغامرة", روحي: "رحمة الله", نصيحة: "كن كالماء" },
            "الجبل": { تفسير: "عز وقوة", نفسي: "طموح", روحي: "ثبات", نصيحة: "تواضع" },
            "القمر": { تفسير: "هدى وجمال", نفسي: "حنان", روحي: "نور إلهي", نصيحة: "اسأل الله النور" },
            "الشمس": { تفسير: "ولاية وضياء", نفسي: "ثقة", روحي: "وحي", نصيحة: "لا تغتر" },
            "الريح": { تفسير: "تقلب", نفسي: "قلق", روحي: "روح الله", نصيحة: "استقيم" }
        };

        const kindMessages = [
            "هذا حلم جميل، ربما يحمل لك خيراً لا نعرفه الآن. استبشر ولا تخف.",
            "لم نجد تفسيراً لحلمك، لكن تذكر أن الرؤيا جزء من نفسك، فانظر فيها بعين الأمل.",
            "حلمك خاص بك، قد يكون رسالة من روحك. تفكر فيه بهدوء وستجد معناه.",
            "لا تحزن، بعض الأحلام تكون مجرد أضغاث، والأهم هو إيمانك بالله.",
            "نحن هنا لأجلك، وحلمك يستحق التأمل. توكل على الله واطلب الخير."
        ];

        function interpretDream() {
            const input = document.getElementById('dreamInput');
            const text = input.value.trim();
            if (text.length < 2) { alert('الرجاء إدخال وصف أوضح للحلم.'); return; }

            let found = null, keyword = null;
            for (const [key, value] of Object.entries(dreamDatabase)) {
                if (text.includes(key)) { found = value; keyword = key; break; }
            }

            let result;
            if (found) {
                result = { تفسير: found.تفسير, نفسي: found.نفسي, روحي: found.روحي, نصيحة: found.نصيحة, مفتاح: keyword, موجود: true };
            } else {
                const msg = kindMessages[Math.floor(Math.random() * kindMessages.length)];
                result = { تفسير: msg, نفسي: "لا يمكن تحديده بدقة، لكنه يعكس مشاعرك الحالية.", روحي: "قد يكون إشارة من روحك، استمع إليها.", نصيحة: "استغفر الله وتوكل عليه، واطلب الرؤية الصالحة.", مفتاح: "غير محدد", موجود: false };
            }

            const section = document.getElementById('resultSection');
            const content = document.getElementById('resultContent');
            content.innerHTML = `
                <div class="result-item"><div class="label">📖 التفسير</div><div class="value">${result.تفسير}</div></div>
                <div class="result-item"><div class="label">🧠 الجانب النفسي</div><div class="value">${result.نفسي}</div></div>
                <div class="result-item"><div class="label">✨ الجانب الروحي</div><div class="value">${result.روحي}</div></div>
                <div class="result-item"><div class="label">💡 النصيحة</div><div class="value">${result.نصيحة}</div></div>
                ${result.موجود ? `<div class="result-item"><div class="label">🔑 الكلمة المفتاحية</div><div class="value">${result.مفتاح}</div></div>` : ''}
                <div class="result-item" style="border-top:2px solid #f0c27f55; margin-top:10px; padding-top:15px; color:#aaa;">🤲 أسأل الله أن يمن عليك بالخير في منامك ويقظة.</div>
            `;
            section.classList.remove('hidden');
            document.getElementById('dreamCount').textContent = Object.keys(dreamDatabase).length;
        }

        function clearAll() {
            document.getElementById('dreamInput').value = '';
            document.getElementById('resultSection').classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('dreamCount').textContent = Object.keys(dreamDatabase).length;
        });
    </script>

</body>
</html>
